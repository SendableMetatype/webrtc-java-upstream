name: Prepare release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Version to release, such as 1.2.3. Leave empty to release the version of gradle.properties without -SNAPSHOT."
        required: false
        default: ""
      developmentVersion:
        description: "Next development version, set on main after the release, such as 1.2.4-SNAPSHOT."
        required: true
        default: "X.Y.Z-SNAPSHOT"
      dryRun:
        description: "Dry run: build every platform and assemble the deployment bundle, but push no commits or tags and publish nothing."
        required: false
        type: boolean
        default: false

# Preparation pushes commits/tags and dispatches publication; dry-run jobs stay read-only.
permissions:
  contents: read

# Two releases at once would race on the pushed commits and tags.
concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  # Nothing reaches main before the release is prepared: the changelog commit,
  # the release commit with its tag and the development commit are made
  # locally, and all of it is pushed in one atomic push at the end. A failure on
  # the way leaves main untouched, so the release can simply be dispatched again.
  prepare-release:
    name: Prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    outputs:
      release_version: ${{ steps.release-version.outputs.version }}
    steps:
      # The full history, for git-cliff.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Git config
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      # The version is the one the release is tagged with: the releaseVersion
      # input, or else the version of gradle.properties without -SNAPSHOT.
      # git-cliff is told it rather than bumping from the commit types, so that
      # the changelog, the tag and the GitHub release always agree.
      - name: Determine and check the versions
        id: release-version
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          DEVELOPMENT_VERSION: ${{ inputs.developmentVersion }}
        run: |
          version="$RELEASE_VERSION"
          if [ -z "$version" ]; then
            version=$(sed -n 's/^version=//p' gradle.properties)
            version="${version%-SNAPSHOT}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The release version must look like 1.2.3"
            exit 1
          fi
          echo "Release version: $version, next development version: $DEVELOPMENT_VERSION"

          if ! [[ "$DEVELOPMENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::developmentVersion must look like 1.2.3-SNAPSHOT, got '$DEVELOPMENT_VERSION'"
            exit 1
          fi
          if [ "${DEVELOPMENT_VERSION%-SNAPSHOT}" == "$version" ]; then
            echo "::error::developmentVersion must differ from the release version $version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/changelog/cliff.toml
          args: -v --tag ${{ steps.release-version.outputs.tag }} --use-branch-tags
        env:
          OUTPUT: CHANGELOG.md

      # The docs' versions go into this commit, so that the tagged tree already
      # names the version it releases.
      - name: Commit CHANGELOG.md and the docs' versions
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          DEVELOPMENT_VERSION: ${{ inputs.developmentVersion }}
        run: |
          sed -i -e "s/VERSION: '.*'/VERSION: '$RELEASE_VERSION'/" \
            -e "s/VERSION_SNAPSHOT: '.*'/VERSION_SNAPSHOT: '$DEVELOPMENT_VERSION'/" docs/.vitepress/versions.ts

          git add CHANGELOG.md docs/.vitepress/versions.ts
          git commit -m "chore(release): Update CHANGELOG.md for $RELEASE_TAG"

      # The release commit sets the release version and is tagged; the next
      # commit moves on to the development version. A dry run creates neither,
      # so there is nothing to push below.
      - name: Prepare release
        if: ${{ !inputs.dryRun }}
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
          DEVELOPMENT_VERSION: ${{ inputs.developmentVersion }}
        run: |
          sed -i "s/^version=.*/version=$RELEASE_VERSION/" gradle.properties
          git commit -am "Prepare release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"

          sed -i "s/^version=.*/version=$DEVELOPMENT_VERSION/" gradle.properties
          git commit -am "Prepare for next development iteration"

      # The branch and the tag land together or not at all.
      - name: Push release commits and tag
        if: ${{ !inputs.dryRun }}
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: git push --atomic origin HEAD:main "refs/tags/$RELEASE_TAG"

      # Explicit dispatch is supported with GITHUB_TOKEN, unlike push events.
      # --ref makes the new run's github.sha the release commit itself.
      - name: Start publication on the release tag
        if: ${{ !inputs.dryRun }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: gh workflow run release-publish.yml --ref "$RELEASE_TAG"

  platforms:
    needs: prepare-release
    if: inputs.dryRun
    uses: ./.github/workflows/platforms.yml
    with:
      retention-days: 7
      version: ${{ needs.prepare-release.outputs.release_version }}

  publish-central:
    name: Assemble dry-run deployment bundle
    if: inputs.dryRun
    needs: [prepare-release, platforms]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Sign and assemble the real release bundle, but never upload it. The
      # placeholder credentials also prevent publication if skip-upload regresses.
      - name: Deploy
        uses: ./.github/actions/publish
        env:
          MAVEN_USERNAME: dry-run-must-not-upload
          MAVEN_TOKEN: dry-run-must-not-upload
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        with:
          version: ${{ needs.prepare-release.outputs.release_version }}
          skip-upload: true

      - name: Verify the dry-run deployment bundle exists
        run: test -s build/nmcp/zip/aggregation.zip

      - name: Summarize what would have been published
        run: |
          {
            echo "## Dry run — nothing was published"
            echo
            echo "Version: \`${{ needs.prepare-release.outputs.release_version }}\`"
            echo
            echo "Contents of the deployment bundle:"
            echo '```'
            unzip -Z1 build/nmcp/zip/aggregation.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the deployment bundle for inspection
        uses: actions/upload-artifact@v7
        with:
          name: deployment-bundle-dry-run
          path: build/nmcp/zip/aggregation.zip
          if-no-files-found: error
          retention-days: 7
