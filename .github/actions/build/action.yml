name: 'Gradle Build'

description: 'Build the native libraries of one platform and upload them as artifacts'

inputs:
  platform-name:
    description: 'The target platform.'
    required: true

  platform:
    description: 'The classifier of a cross compiled platform. Empty for the runner''s own.'
    required: false
    default: ''

  version:
    description: 'The project version to build with, when not the one gradle.properties sets.'
    required: false
    default: ''

  java-version:
    description: 'The Java build version.'
    required: false
    default: '17'

  retention-days:
    description: 'How long the natives artifacts are kept.'
    required: false
    default: '1'

runs:
  using: "composite"
  steps:
    - name: Derive the WebRTC cache branch from the build properties
      run: echo "WEBRTC_CACHE_BRANCH=$(sed -n 's|^webrtc.branch=branch-heads/||p' gradle.properties)" >> "$GITHUB_ENV"
      shell: bash

    # Restored here, saved right after the build below: the post step of
    # actions/cache only saves when the whole job succeeds, so a failure in a
    # later step would otherwise throw away a WebRTC build that took the better
    # part of an hour.
    - id: webrtc-cache
      name: Restore WebRTC cache
      uses: actions/cache/restore@v6
      with:
        path: ~/${{ env.WEBRTC_INSTALL_FOLDER }}
        key: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-jni/src/main/cpp/dependencies/webrtc/CMakeLists.txt', 'webrtc-jni/src/main/cpp/dependencies/webrtc/patches/**/*.patch') }}-${{ hashFiles('webrtc-jni/build.gradle.kts') }}
        restore-keys: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-jni/src/main/cpp/dependencies/webrtc/CMakeLists.txt', 'webrtc-jni/src/main/cpp/dependencies/webrtc/patches/**/*.patch') }}-

    - name: Derive the FFmpeg version from the build properties
      run: echo "FFMPEG_VERSION=$(sed -n 's|^ffmpeg.version=||p' gradle.properties)" >> "$GITHUB_ENV"
      shell: bash

    - id: ffmpeg-cache
      name: Restore FFmpeg cache
      uses: actions/cache/restore@v6
      with:
        path: ~/ffmpeg
        key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-media/src/main/cpp/dependencies/ffmpeg/CMakeLists.txt', 'webrtc-media/src/main/cpp/dependencies/ffmpeg/patches/*.patch', 'webrtc-media/src/main/cpp/dependencies/libva/*') }}-${{ hashFiles('webrtc-media/build.gradle.kts') }}
        restore-keys: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-media/src/main/cpp/dependencies/ffmpeg/CMakeLists.txt', 'webrtc-media/src/main/cpp/dependencies/ffmpeg/patches/*.patch', 'webrtc-media/src/main/cpp/dependencies/libva/*') }}-

    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'

    # Also caches the Gradle distribution and the dependencies.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    # The tests are compiled here, also those of the JavaFX module, which no
    # lane runs. They run in test-natives, against the uploaded jars. The
    # native library jars are named after the version, which the tests and the
    # publication look them up by.
    - name: Build
      env:
        PLATFORM: ${{ inputs.platform }}
        VERSION: ${{ inputs.version }}
      run: ./gradlew assemble testClasses ${PLATFORM:+-Pwebrtc.platform=$PLATFORM} ${VERSION:+-Pversion=$VERSION}
      shell: bash

    - name: Save WebRTC cache
      if: steps.webrtc-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/${{ env.WEBRTC_INSTALL_FOLDER }}
        key: ${{ steps.webrtc-cache.outputs.cache-primary-key }}

    - name: Save FFmpeg cache
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/ffmpeg
        key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

    # The natives of every platform go to test-natives, which tests them on a
    # runner of their own OS and architecture, and to the callers' publishing
    # job, which attaches all of them to a single deployment. Both artifacts
    # hold one flat jar each, so that a natives-* download with merge-multiple
    # puts every jar into one directory.
    - name: Upload native library jar
      uses: actions/upload-artifact@v7
      with:
        name: natives-${{ inputs.platform-name }}
        path: webrtc-jni/build/libs/webrtc-java-*.jar
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    # Only the classifier jar: the main jar is platform independent and the
    # publishing job builds it itself.
    - name: Upload media native library jar
      uses: actions/upload-artifact@v7
      with:
        name: natives-media-${{ inputs.platform-name }}
        path: |
          webrtc-media/build/libs/webrtc-java-media-*-windows-*.jar
          webrtc-media/build/libs/webrtc-java-media-*-linux-*.jar
          webrtc-media/build/libs/webrtc-java-media-*-macos-*.jar
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
