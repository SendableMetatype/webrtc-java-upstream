name: 'Test Natives'

description: 'Run the test suite on a runner of the platform''s own OS and architecture, against the natives the build job uploaded'

inputs:
  platform-name:
    description: 'The platform name of the lane that built the natives.'
    required: true

  classifier:
    description: 'The classifier of the natives.'
    required: true

  version:
    description: 'Optional local project version override for a release dry run.'
    required: false
    default: ''

  java-version:
    description: 'The Java version.'
    required: true
    default: '17'

  java-distribution:
    description: 'The setup-java distribution. It must provide a JDK for the runner architecture.'
    required: true
    default: 'temurin'

  java-architecture:
    description: 'The JDK architecture, when it differs from the runner architecture.'
    required: false
    default: ''

  jni-check:
    description: 'Run the tests under -Xcheck:jni instead, and fail on any JNI error or warning it reports.'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    # The build uploads each platform's two native jars as separate artifacts,
    # one flat jar each.
    - name: Download natives
      uses: actions/download-artifact@v8
      with:
        name: natives-${{ inputs.platform-name }}
        path: natives

    - name: Download media natives
      uses: actions/download-artifact@v8
      with:
        name: natives-media-${{ inputs.platform-name }}
        path: natives

    # PulseAudio, libudev and libdbus are deliberately not installed as runtime
    # libraries: the natives open them at runtime, and the armhf lane, whose
    # image has none of them, proves that they load without them.
    - name: Install 32-bit runtime libraries
      if: runner.os == 'Linux' && inputs.java-architecture == 'armv7'
      run: |
        sudo dpkg --add-architecture armhf
        sudo apt-get update
        sudo apt-get install -y libc6:armhf libstdc++6:armhf zlib1g:armhf libx11-6:armhf libxext6:armhf libxfixes3:armhf libxdamage1:armhf libxtst6:armhf libxrandr2:armhf libxcomposite1:armhf libglib2.0-0:armhf libgbm1:armhf libdrm2:armhf
      shell: bash

    - name: Install runtime libraries
      if: runner.os == 'Linux' && inputs.java-architecture != 'armv7'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-6 libxext6 libxfixes3 libxdamage1 libxtst6 libxrandr2 libxcomposite1 libglib2.0-0 libgbm1 libdrm2
      shell: bash

    # Not a runtime library either: DeviceBackendTests starts a PulseAudio
    # server of its own, with virtual devices only, to remove a default device
    # while the natives use it. The armhf lane keeps running without it. No
    # autospawn, so that the other tests still find no server running.
    - name: Install a PulseAudio server for the device tests
      if: runner.os == 'Linux' && inputs.java-architecture != 'armv7'
      run: |
        sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
        mkdir -p ~/.config/pulse
        echo "autospawn = no" > ~/.config/pulse/client.conf
      shell: bash

    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        architecture: ${{ inputs.java-architecture }}

    # Also caches the Gradle distribution and the dependencies.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    # The Swing view paints into images, which needs no display. natives.dir
    # puts the downloaded natives on the class path of the tests and turns the
    # native build off: these natives were cross compiled by another job, and
    # this runner is here to run them, not to build them again.
    - name: Test
      if: inputs.jni-check != 'true'
      env:
        VERSION: ${{ inputs.version }}
      run: >
        ./gradlew :webrtc:test :webrtc-media:test :webrtc-swing:test --continue
        -Pnatives.dir=natives -Pwebrtc.platform=${{ inputs.classifier }}
        ${VERSION:+-Pversion=$VERSION}
      shell: bash

    # The same tests under -Xcheck:jni, which checks every JNI call of the
    # natives: a fatal error ends the test JVM, and a call made without
    # checking for the exception the previous one may have thrown is a
    # warning. The JVM writes them to native stdout, so the log goes to a file:
    # one warning comes with a whole stack, and many of them would make an
    # unreadable job log. The report counts them, sums them up by where they
    # come from and fails on any, so that a missing check cannot creep back in.
    - name: Test under -Xcheck:jni
      if: inputs.jni-check == 'true'
      env:
        VERSION: ${{ inputs.version }}
      run: |
        status=0
        ./gradlew :webrtc:test :webrtc-media:test --continue -Pjni-check \
          -Pnatives.dir=natives -Pwebrtc.platform=${{ inputs.classifier }} \
          ${VERSION:+-Pversion=$VERSION} > jni-check.log 2>&1 || status=$?

        # What Gradle reported about the tests, which went to the file as well.
        grep -E 'tests completed|FAILED|BUILD (SUCCESSFUL|FAILED)' jni-check.log | tail -n 200 || true

        bash "$GITHUB_ACTION_PATH/jni-check-report.sh" jni-check.log 0 || status=1

        exit $status
      shell: bash

    # What failed, for runners that cannot be reproduced locally.
    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports-native-${{ inputs.platform-name }}${{ inputs.jni-check == 'true' && '-jni-check' || '' }}
        # A native crash ends the test JVM with a report of its own beside the
        # module, which names the thread that crashed and what it ran.
        # Under -Xcheck:jni, the first of its diagnostics with their stacks,
        # rather than the whole log.
        path: |
          **/build/reports/tests/
          **/build/test-results/
          **/hs_err_pid*.log
          jni-check-excerpt.txt
        if-no-files-found: ignore
        retention-days: 7
