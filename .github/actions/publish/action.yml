name: 'Gradle Publish'

description: 'Deploy one version with the native libraries of every platform attached, as a single deployment'

# Expects the checkout of the version to deploy, a JDK, Gradle, and
# MAVEN_USERNAME and MAVEN_TOKEN in the environment of the calling step. A
# release also has MAVEN_GPG_PRIVATE_KEY and MAVEN_GPG_PASSPHRASE there, which
# makes the build sign every file.

inputs:
  version:
    description: 'The version to deploy, as the natives jars are named.'
    required: true

  skip-upload:
    description: 'Build, sign and bundle everything, but upload nothing.'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Download the native library jars of all platforms
      uses: actions/download-artifact@v8
      with:
        pattern: natives-*
        path: natives
        merge-multiple: true

    # natives.dir makes webrtc and webrtc-media attach the jars of all
    # platforms instead of the host's, and the build fails if one is missing.
    # A snapshot goes to the snapshot repository, a release into one
    # deployment of the Central Portal. skip-upload still signs and bundles
    # the release, into build/nmcp/zip/aggregation.zip, but uploads nothing.
    - name: Deploy
      env:
        VERSION: ${{ inputs.version }}
        SKIP_UPLOAD: ${{ inputs.skip-upload }}
      run: |
        if [ "$SKIP_UPLOAD" == "true" ]; then
          task=nmcpZipAggregation
        elif [[ "$VERSION" == *-SNAPSHOT ]]; then
          task=publishAggregationToCentralPortalSnapshots
        else
          task=publishAggregationToCentralPortal
        fi

        ./gradlew "$task" -Pnatives.dir=natives -Pversion="$VERSION"
      shell: bash
